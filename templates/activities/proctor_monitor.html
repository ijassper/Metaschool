{% extends 'base.html' %}

{% block content %}
<style>
    .proctor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1rem; }
    .proctor-tile { overflow:hidden; border:1px solid #dee2e6; border-radius:1rem; background:#fff; box-shadow:0 .25rem 1rem rgba(0,0,0,.07); }
    .proctor-screen { position:relative; aspect-ratio:16/10; background:#20242a; display:flex; align-items:center; justify-content:center; color:#adb5bd; cursor:zoom-in; }
    .proctor-screen img { width:100%; height:100%; object-fit:contain; }
    .proctor-screen-info { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; background:rgba(0,0,0,.65); color:#fff; font-size:.85rem; line-height:1.25; }
    .proctor-student-info { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .proctor-screen-info .proctor-state { flex:0 0 auto; padding:2px 7px; }
    .proctor-state { font-size:.78rem; border-radius:999px; padding:.25rem .55rem; font-weight:700; }
    .state-live { background:#d1e7dd; color:#0f5132; }
    .state-stale { background:#fff3cd; color:#664d03; }
    .state-wait { background:#e9ecef; color:#6c757d; }
    .state-away, .state-error { background:#dc3545; color:#fff; animation:proctor-alert 1s ease-in-out infinite alternate; }
    .state-ended { background:#6c757d; color:#fff; }
    .proctor-summary { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .proctor-summary span { border-radius:999px; padding:4px 9px; font-size:.75rem; font-weight:800; white-space:nowrap; }
    .summary-live { background:#d1e7dd; color:#0f5132; }
    .summary-delayed { background:#fff3cd; color:#664d03; }
    .summary-problem { background:#f8d7da; color:#842029; }
    @keyframes proctor-alert { from { opacity:1; } to { opacity:.58; } }
    .proctor-toolbar { display:flex; align-items:center; gap:16px; margin-bottom:12px; min-width:0; }
    .proctor-toolbar-heading { flex:0 0 auto; margin:0; font-size:1.25rem; font-weight:800; white-space:nowrap; }
    .proctor-toolbar-detail { display:flex; align-items:center; gap:12px; flex:1 1 auto; min-width:0; }
    .proctor-toolbar-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:5px 10px; border:1px solid #e5d8ed; border-radius:8px; background:#fff; }
    .proctor-toolbar-label:first-child { flex:0 1 35%; font-weight:700; }
    .proctor-toolbar-label:last-child { flex:1 1 auto; color:#6c757d; }
    .proctor-toolbar-back { flex:0 0 auto; margin-left:auto; white-space:nowrap; }
    @media (max-width:768px) { .proctor-toolbar { gap:8px; } .proctor-toolbar-heading { font-size:1rem; } .proctor-toolbar-detail { gap:6px; } .proctor-toolbar-back { padding:5px 10px !important; font-size:.8rem; } }
</style>

<div class="container-fluid py-2 px-lg-3">
    <div class="proctor-toolbar">
        <h3 class="proctor-toolbar-heading"><i class="bi bi-display text-danger me-2"></i>학생 모니터 감시 중</h3>
        <div class="proctor-toolbar-detail">
            <span class="proctor-toolbar-label" title="{{ activity.section }}">{{ activity.section }}</span>
            <span class="proctor-toolbar-label" title="{{ activity.title }}">{{ activity.title }}</span>
        </div>
        <div class="proctor-summary" aria-label="감독 연결 요약">
            <span id="summaryLive" class="summary-live">정상 0</span>
            <span id="summaryDelayed" class="summary-delayed">지연 0</span>
            <span id="summaryProblem" class="summary-problem">확인 필요 0</span>
        </div>
        <a href="{% url 'proctor_replay' activity.id %}" class="btn btn-outline-primary rounded-pill text-nowrap">기록 다시보기</a>
        <a href="{% url 'activity_result' activity.id %}" class="proctor-toolbar-back btn btn-outline-secondary rounded-pill px-3">제출현황으로</a>
    </div>
    <div id="storageWarning" class="alert alert-danger py-2 mt-2 d-none" role="alert"></div>
    <div id="proctorGrid" class="proctor-grid"></div>
</div>

<div class="modal fade" id="screenModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content bg-dark">
        <div class="modal-header border-0 text-white"><h5 id="screenModalTitle" class="modal-title"></h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body p-0 text-center"><img id="screenModalImage" class="img-fluid" alt="학생 공유 화면 확대"></div>
    </div></div>
</div>

<script>
(() => {
    const feedUrl = "{% url 'proctor_feed' activity.id %}";
    const grid = document.getElementById('proctorGrid');
    const tiles = new Map();
    let polling = false;

    function ensureTile(student) {
        if (tiles.has(student.id)) return tiles.get(student.id);
        const tile = document.createElement('article');
        tile.className = 'proctor-tile';
        tile.innerHTML = `<div class="proctor-screen"><span class="empty-message">화면 수신 대기</span><img class="d-none" alt=""><div class="proctor-screen-info"><span class="proctor-student-info"><span class="student-meta"></span> <strong class="student-name"></strong></span><span class="proctor-state state-wait">기록 없음</span></div></div>`;
        tile.querySelector('.student-name').textContent = student.name;
        tile.querySelector('.student-meta').textContent = `${student.grade}학년 ${student.class_no}반 ${student.number}번`;
        tile.querySelector('.proctor-screen').addEventListener('click', () => {
            const image = tile.querySelector('img');
            if (image.classList.contains('d-none')) return;
            document.getElementById('screenModalTitle').textContent = `${student.name} 학생 화면`;
            document.getElementById('screenModalImage').src = image.src;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('screenModal')).show();
        });
        grid.appendChild(tile);
        tiles.set(student.id, tile);
        return tile;
    }

    function render(data) {
        const warning = document.getElementById('storageWarning');
        const paused = data.storage && !data.storage.allowed;
        warning.classList.toggle('d-none', !paused);
        warning.textContent = paused ? data.storage.message : '';
        const serverNow = new Date(data.server_time).getTime();
        const counts = {live: 0, delayed: 0, problem: 0};
        data.students.forEach(student => {
            const tile = ensureTile(student);
            const image = tile.querySelector('img');
            const empty = tile.querySelector('.empty-message');
            const state = tile.querySelector('.proctor-state');
            const receivedAt = student.captured_at ? new Date(student.captured_at) : null;
            const age = receivedAt ? Math.max(0, (serverNow - receivedAt.getTime()) / 1000) : null;
            const ago = age === null ? '' : age < 5 ? '방금' : age < 60 ? `${Math.round(age)}초 전` : `${Math.floor(age / 60)}분 전`;
            state.title = receivedAt ? `마지막 수신 ${receivedAt.toLocaleString('ko-KR')}` : '수신된 화면이 없습니다.';
            const stateConfig = {
                LIVE: ['state-live', `정상 수신 · ${ago}`],
                DELAYED: ['state-stale', `수신 지연 · ${ago}`],
                STOPPED: ['state-error', `녹화 중단${ago ? ` · ${ago}` : ''}`],
                NONE: ['state-wait', '기록 없음'],
                AWAY: ['state-away', `앱 이탈${ago ? ` · ${ago}` : ''}`],
                ERROR: ['state-error', `녹화 오류${ago ? ` · ${ago}` : ''}`],
                ENDED: ['state-ended', `종료${ago ? ` · ${ago}` : ''}`],
            };
            const configured = stateConfig[student.connection_state] || stateConfig.NONE;
            state.className = `proctor-state ${configured[0]}`;
            state.textContent = configured[1];
            if (student.connection_state === 'LIVE') counts.live += 1;
            else if (student.connection_state === 'DELAYED') counts.delayed += 1;
            else if (student.connection_state !== 'ENDED') counts.problem += 1;
            if (!student.snapshot_id) {
                return;
            }
            if (tile.dataset.snapshotId !== String(student.snapshot_id)) {
                image.src = `${student.image_url}?v=${student.snapshot_id}`;
                image.alt = `${student.name} 학생 공유 화면`;
                image.classList.remove('d-none'); empty.classList.add('d-none');
                tile.dataset.snapshotId = student.snapshot_id;
            }
        });
        document.getElementById('summaryLive').textContent = `정상 ${counts.live}`;
        document.getElementById('summaryDelayed').textContent = `지연 ${counts.delayed}`;
        document.getElementById('summaryProblem').textContent = `확인 필요 ${counts.problem}`;
    }

    async function poll() {
        if (polling || document.hidden) return;
        polling = true;
        try { const response = await fetch(feedUrl, {headers:{'X-Requested-With':'XMLHttpRequest'}}); if (response.ok) render(await response.json()); }
        finally { polling = false; }
    }
    poll();
    setInterval(poll, 3000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
</script>
{% endblock %}
