{% extends 'base.html' %}
{% block content %}
<div class="container-fluid py-2">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h4 class="m-0"><i class="bi bi-film"></i> 감독 기록 다시보기</h4>
    <span>{{ activity.section }} · {{ activity.title }}</span>
    <a class="btn btn-outline-secondary ms-auto" href="{% url 'activity_result' activity.id %}">제출현황으로</a>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-2">
    <select id="student" class="form-select" style="width:auto" aria-label="학생 선택">
      {% for s in students %}<option value="{{ s.student_id }}">{{ s.student__grade }}학년 {{ s.student__class_no }}반 {{ s.student__number }}번 {{ s.student__name }}</option>{% endfor %}
    </select>
    <input id="day" type="date" class="form-control" style="width:auto" aria-label="기록 날짜">
    <button id="load" class="btn btn-outline-primary">기록 조회</button>
    <button id="download" class="btn btn-primary" disabled>MP4 다운로드</button>
  </div>
  <div id="notice" role="status" class="text-secondary mb-2">학생을 선택해 기록을 조회하세요. 날짜를 비우면 전체 기록을 조회합니다.</div>
  <div style="background:#20242a;text-align:center;min-height:200px"><img id="frame" alt="감독 기록 화면" style="max-width:100%;max-height:65vh"></div>
  <div class="d-flex align-items-center gap-2 mt-2">
    <button id="play" class="btn btn-outline-primary" disabled>재생</button>
    <select id="speed" class="form-select" style="width:auto" aria-label="재생 배속"><option value="1">1배속</option><option value="2">2배속</option><option value="4">4배속</option><option value="8">8배속</option></select>
    <input id="timeline" type="range" min="0" max="0" value="0" class="flex-grow-1" aria-label="촬영 시각 이동" disabled>
    <span id="time" class="text-nowrap"></span>
  </div>
  <small class="text-secondary">3초 간격의 저장 이미지입니다. 촬영되지 않은 구간에는 이전 화면이 유지되며, 실제 연속 영상이 아닙니다. MP4는 요청 시 생성되며 서버에 별도 보관하지 않습니다.</small>
</div>
<script>
(() => {
 const el = id => document.getElementById(id);
 const url = "{% url 'proctor_recording' activity.id 0 %}";
 let frames=[], index=0, timer=null, playing=false, downloadUrl='', generation=0;
 function pause(){playing=false; clearTimeout(timer); el('play').textContent='재생';}
 function show(){if(!frames.length)return; el('frame').src=frames[index].url; el('timeline').value=index; el('time').textContent=new Date(frames[index].time).toLocaleString('ko-KR')+` (${index+1}/${frames.length})`;}
 function step(){if(!playing)return; if(index>=frames.length-1){pause();return;} const delay=(new Date(frames[index+1].time)-new Date(frames[index].time))/Number(el('speed').value); timer=setTimeout(()=>{index++;show();step();},Math.max(100,delay));}
 async function load(){pause(); const token=++generation; frames=[]; el('frame').removeAttribute('src'); el('play').disabled=el('timeline').disabled=el('download').disabled=true; el('notice').textContent='기록을 불러오는 중…'; el('time').textContent='';
  if(!el('student').value){el('notice').textContent='저장된 감독 기록이 없습니다.';return;}
  try{const response=await fetch(url.replace('/0/','/'+el('student').value+'/')+'?date='+el('day').value); const data=await response.json();if(token!==generation)return; if(!response.ok)throw Error(data.message||'조회 실패'); frames=data.frames; index=0; downloadUrl=data.download_url+'?date='+el('day').value; el('notice').textContent=frames.length?`저장 화면 ${frames.length}장`:'해당 기간에 저장된 화면이 없습니다.'; el('timeline').max=Math.max(0,frames.length-1); el('play').disabled=el('timeline').disabled=el('download').disabled=!frames.length;show();}catch(e){el('notice').textContent=e.message;}
 }
 el('load').onclick=load;el('student').onchange=load;el('day').onchange=load;
 el('play').onclick=()=>{if(playing){pause();return;}if(index===frames.length-1){index=0;show();}playing=true;el('play').textContent='일시정지';step();};
 el('timeline').oninput=()=>{pause();index=Number(el('timeline').value);show();};el('speed').onchange=()=>{clearTimeout(timer);step();};
 el('download').onclick=()=>{el('notice').textContent='새 탭에서 MP4 다운로드를 시작합니다. 영상 생성에 시간이 걸릴 수 있습니다.';window.open(downloadUrl,'_blank','noopener');};
 window.addEventListener('pagehide',pause);load();
})();
</script>
{% endblock %}
