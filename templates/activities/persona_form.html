{% extends 'base.html' %}

{% block content %}
<div class="persona-form-page container-fluid px-4 py-3">
    <header><div><span>AI PERSONA</span><h2>페르소나 {{ action }}</h2><p>AI가 어떤 교사처럼 사고하고 응답할지 정의합니다.</p></div><a href="{% url 'persona_list' %}"><i class="bi bi-arrow-left"></i> 목록으로</a></header>
    <form method="post" class="persona-form-card">{% csrf_token %}
        <div class="persona-field"><label for="personaName">페르소나 이름 <b>*</b></label><input id="personaName" name="name" maxlength="100" required value="{% if form_data %}{{ form_data.name }}{% else %}{{ persona.name|default:'' }}{% endif %}" placeholder="예: 베테랑 담임 교사"></div>
        <div class="persona-field"><label for="personaDescription">역할 설명</label><textarea id="personaDescription" name="description" rows="3" placeholder="이 페르소나의 경력, 관점과 목표를 설명하세요.">{% if form_data %}{{ form_data.description }}{% else %}{{ persona.description|default:'' }}{% endif %}</textarea></div>
        <div class="persona-dimension-grid">
            <div class="persona-field"><label for="personaContext">활동 맥락</label><select id="personaContext" name="category_context"><option value="">공통</option>{% for value, label in category_options %}<option value="{{ value }}" {% if form_data.category_context == value or not form_data and persona.category_context == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
            <div class="persona-field"><label for="personaTaskType">작업 유형</label><select id="personaTaskType" name="task_type"><option value="">공통</option>{% for value, label in task_type_options %}<option value="{{ value }}" {% if form_data.task_type == value or not form_data and persona.task_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
        </div>
        <div class="persona-field"><label for="personaTone">기본 어조</label><select id="personaTone" name="tone_default">{% for tone in tone_options %}<option value="{{ tone }}" {% if form_data.tone_default == tone or not form_data and persona.tone_default == tone %}selected{% endif %}>{{ tone }}</option>{% endfor %}</select></div>
        <div class="persona-field"><label for="personaPrompt">시스템 프롬프트 <b>*</b></label><textarea id="personaPrompt" name="system_prompt" rows="10" required placeholder="예: 당신은 20년 경력의 통합사회 교사입니다...">{% if form_data %}{{ form_data.system_prompt }}{% else %}{{ persona.system_prompt|default:'' }}{% endif %}</textarea><small>학생 개인정보를 추측하거나 단정하지 않고, 답안의 근거를 중심으로 분석하도록 지시하는 것을 권장합니다.</small></div>
        <div class="persona-form-actions"><a href="{% url 'persona_list' %}">취소</a><button type="submit"><i class="bi bi-check2"></i> {{ action }} 완료</button></div>
    </form>
</div>
<style>
    .persona-form-page{max-width:880px;margin:0 auto;color:#39333d}.persona-form-page header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.persona-form-page header span{color:#8e44ad;font-size:.66rem;font-weight:850;letter-spacing:.1em}.persona-form-page h2{margin:.2rem 0;font-size:1.5rem;font-weight:850}.persona-form-page header p{margin:0;color:#958b99;font-size:.75rem}.persona-form-page header>a{padding:.5rem .75rem;border:1px solid #e5dbe7;border-radius:999px;color:#756a79;font-size:.72rem;text-decoration:none}.persona-form-card{padding:1.4rem;border:1px solid #eadfeb;border-radius:18px;background:linear-gradient(145deg,#fff,#fffbfd);box-shadow:0 12px 34px rgba(82,47,98,.075)}.persona-field+.persona-field{margin-top:1rem}.persona-dimension-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}.persona-dimension-grid .persona-field{margin-top:0}.persona-field label{display:block;margin-bottom:.4rem;color:#5b505f;font-size:.76rem;font-weight:780}.persona-field label b{color:#d94d91}.persona-field input,.persona-field textarea,.persona-field select{width:100%;padding:.75rem .85rem;border:1px solid #e4dae6;border-radius:11px;background:#fff;color:#453d49;font-size:.8rem;outline:none}.persona-field input:focus,.persona-field textarea:focus,.persona-field select:focus{border-color:#b985c8;box-shadow:0 0 0 3px rgba(142,68,173,.08)}.persona-field textarea{line-height:1.6;resize:vertical}.persona-field small{display:block;margin-top:.4rem;color:#a096a5;font-size:.66rem}.persona-form-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.3rem}.persona-form-actions a,.persona-form-actions button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:0 1rem;border-radius:10px;font-size:.76rem;font-weight:760;text-decoration:none}.persona-form-actions a{border:1px solid #e5dbe7;color:#756a79}.persona-form-actions button{border:0;background:var(--ingrid-gradient);color:#fff}@media(max-width:640px){.persona-dimension-grid{grid-template-columns:1fr}}
</style>
{% endblock %}
