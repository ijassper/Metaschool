<style>
.note-sort-item .toc-page,.note-sort-item .section-page-card{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.note-sort-item img{pointer-events:none;-webkit-user-drag:none}.note-sort-item.is-lifted{opacity:.25}
.note-drag-ghost{position:fixed;z-index:1502;pointer-events:none;opacity:.94;transform:rotate(-3deg) scale(1.05);box-shadow:0 18px 42px rgba(39,19,48,.3);border-radius:12px;background:#fff;overflow:hidden}
.note-drop-list-active{outline:3px dashed #a75abb;outline-offset:5px;border-radius:10px}
.note-drop-shelf[hidden]{display:none}.note-drop-shelf{position:fixed;z-index:1501;top:12%;right:14px;width:min(270px,42vw);max-height:72vh;overflow:auto;padding:12px;border:1px solid #d9c6df;border-radius:17px;background:#fff;box-shadow:0 16px 38px rgba(39,19,48,.25)}
.note-drop-shelf strong{display:block;margin-bottom:8px;color:#603272;font-size:.95rem}.note-drop-target{display:block;width:100%;margin:5px 0;padding:9px;border:1px solid #e6dce9;border-radius:9px;background:#fbf8fc;text-align:left;color:#47364c;font-size:.83rem;font-weight:750}.note-drop-target.is-active{border-color:#8e44ad;background:#ead9f0;color:#642878}
.note-drag-hint{position:fixed;z-index:1503;left:50%;bottom:18px;max-width:90vw;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#3c2545;color:#fff;font-size:.86rem;font-weight:750;pointer-events:none}
</style>
<script>
(function(){
 const csrf=document.querySelector('[name=csrfmiddlewaretoken]')?.value;
 const shelf=document.getElementById('noteDropShelf');
 if(!csrf||!shelf)return;
 const lists=Array.from(document.querySelectorAll('.sortable-note-list'));
 const targets=Array.from(shelf.querySelectorAll('.note-drop-target'));
 let pending=null,scrollGesture=null,drag=null,saving=false;
 function sectionValue(value){return value==='general'?'general':Number(value);}
 function statusFor(list){return list?.nextElementSibling?.classList.contains('page-order-status')?list.nextElementSibling:null;}
 function announce(message,list){const status=statusFor(list);if(status)status.textContent=message;}
 function renumber(list){list.querySelectorAll('.note-page-number').forEach((node,index)=>{node.textContent=String(index+1);});}
 function clearPending(){if(pending){clearTimeout(pending.timer);pending=null;}}
 function candidateAt(x,y){
  const element=document.elementFromPoint(x,y);
  const target=element?.closest('.note-drop-target');
  if(target)return {sectionId:target.dataset.sectionId,list:null,target};
  const list=element?.closest('.sortable-note-list');
  if(list)return {sectionId:list.dataset.sectionId,list,target:null};
  const section=element?.closest('.toc-section[data-section-id]');
  if(section)return {sectionId:section.dataset.sectionId,list:section.querySelector('.sortable-note-list'),target:null};
  return null;
 }
 function highlight(candidate){
  lists.forEach(list=>list.classList.toggle('note-drop-list-active',list===candidate?.list));
  targets.forEach(target=>target.classList.toggle('is-active',target===candidate?.target));
 }
 function update(x,y){
  if(!drag)return;
  drag.x=x;drag.y=y;
  drag.ghost.style.left=(x-drag.offsetX)+'px';drag.ghost.style.top=(y-drag.offsetY)+'px';
  if(Math.hypot(x-drag.startX,y-drag.startY)<10){drag.candidate=null;highlight(null);return;}
  const candidate=candidateAt(x,y);drag.candidate=candidate;highlight(candidate);
  if(!candidate?.list)return;
  const others=Array.from(candidate.list.querySelectorAll('.note-sort-item')).filter(item=>item!==drag.item);
  const anchor=others.find(item=>{const rect=item.getBoundingClientRect();if(candidate.list.classList.contains('toc-page-strip'))return x<rect.left+rect.width/2;return y<rect.top||(y<=rect.bottom&&x<rect.left+rect.width/2);});
  if(anchor)candidate.list.insertBefore(drag.item,anchor);else candidate.list.appendChild(drag.item);
  renumber(candidate.list);
 }
 function start(item,event){
  if(saving)return;
  const card=item.querySelector('.toc-page,.section-page-card'),rect=card.getBoundingClientRect();
  const ghost=card.cloneNode(true);ghost.classList.add('note-drag-ghost');ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';document.body.appendChild(ghost);
  const hint=document.createElement('div');hint.className='note-drag-hint';hint.textContent='원하는 위치나 오른쪽 단원에 놓으세요';document.body.appendChild(hint);
  drag={item,source:item.closest('.sortable-note-list'),next:item.nextElementSibling,ghost,hint,pointerId:event.pointerId,offsetX:event.clientX-rect.left,offsetY:event.clientY-rect.top,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,candidate:null};
  item.classList.add('is-lifted');shelf.hidden=false;document.body.setPointerCapture(event.pointerId);
  if(navigator.vibrate)navigator.vibrate(35);update(event.clientX,event.clientY);
 }
 function reset(){
  if(!drag)return;
  drag.item.classList.remove('is-lifted');drag.ghost.remove();drag.hint.remove();
  if(document.body.hasPointerCapture(drag.pointerId))document.body.releasePointerCapture(drag.pointerId);
  shelf.hidden=true;highlight(null);drag=null;
 }
 function restore(){if(!drag)return;const {item,source,next}=drag;if(next?.parentElement===source)source.insertBefore(item,next);else source.appendChild(item);renumber(source);reset();}
 async function finish(cancelled){
  if(!drag)return;
  if(cancelled||!drag.candidate){restore();return;}
  const {item,source,candidate,next}=drag,targetList=candidate.list,targetSection=candidate.sectionId;
  if(!targetSection){restore();return;}
  if(targetList===source&&item.nextElementSibling===drag.next){reset();return;}
  const before=targetList?item.nextElementSibling:null;
  const payload={move_page_id:Number(item.dataset.pageId),target_section_id:sectionValue(targetSection),before_page_id:before?Number(before.dataset.pageId):null};
  const url=source.dataset.reorderUrl;saving=true;reset();announce('노트 위치를 저장하는 중...',targetList||source);
  try{
   const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(payload)});
   if(!response.ok){const result=await response.json();throw new Error(result.message||'노트 위치를 저장하지 못했습니다.');}
   window.location.reload();
  }catch(error){if(next?.parentElement===source)source.insertBefore(item,next);else source.appendChild(item);renumber(source);if(targetList&&targetList!==source)renumber(targetList);announce(error.message,source);}
  finally{saving=false;}
 }
 lists.forEach(list=>list.querySelectorAll('.note-sort-item').forEach(item=>{
  const card=item.querySelector('.toc-page,.section-page-card');if(!card)return;
  card.addEventListener('contextmenu',event=>event.preventDefault());card.addEventListener('dragstart',event=>event.preventDefault());
  card.addEventListener('pointerdown',event=>{if(saving||event.button!==0)return;clearPending();scrollGesture=null;const timer=setTimeout(()=>{if(pending?.item===item){pending=null;start(item,event);}},480);pending={item,timer,x:event.clientX,y:event.clientY,pointerId:event.pointerId,list};});
  card.addEventListener('click',event=>{if(item.dataset.suppressClick==='1'){event.preventDefault();item.dataset.suppressClick='';}});
 }));
 document.addEventListener('pointermove',event=>{
  if(pending&&event.pointerId===pending.pointerId&&Math.hypot(event.clientX-pending.x,event.clientY-pending.y)>10){
   if(event.pointerType==='touch')scrollGesture={pointerId:event.pointerId,list:pending.list,item:pending.item,x:event.clientX,y:event.clientY};
   clearPending();
  }
  if(scrollGesture&&event.pointerId===scrollGesture.pointerId){event.preventDefault();if(scrollGesture.list.classList.contains('toc-page-strip'))scrollGesture.list.scrollLeft-=event.clientX-scrollGesture.x;else window.scrollBy(0,scrollGesture.y-event.clientY);scrollGesture.x=event.clientX;scrollGesture.y=event.clientY;}
  if(drag&&event.pointerId===drag.pointerId){event.preventDefault();update(event.clientX,event.clientY);}
 },{passive:false});
 document.addEventListener('pointerup',event=>{if(pending&&event.pointerId===pending.pointerId)clearPending();if(scrollGesture?.pointerId===event.pointerId){scrollGesture.item.dataset.suppressClick='1';scrollGesture=null;}if(drag&&event.pointerId===drag.pointerId){event.preventDefault();drag.item.dataset.suppressClick='1';finish(false);}});
 document.addEventListener('pointercancel',event=>{if(pending&&event.pointerId===pending.pointerId)clearPending();if(scrollGesture?.pointerId===event.pointerId)scrollGesture=null;if(drag&&event.pointerId===drag.pointerId)finish(true);});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&drag){event.preventDefault();finish(true);}});
 setInterval(()=>{
  if(!drag||Math.hypot(drag.x-drag.startX,drag.y-drag.startY)<10)return;
  const shelfRect=shelf.getBoundingClientRect();
  if(drag.x>=shelfRect.left&&drag.x<=shelfRect.right&&drag.y>=shelfRect.top&&drag.y<=shelfRect.bottom){
   if(drag.y<shelfRect.top+45)shelf.scrollTop-=12;
   else if(drag.y>shelfRect.bottom-45)shelf.scrollTop+=12;
  }else if(drag.y<65)window.scrollBy(0,-15);
  else if(drag.y>window.innerHeight-65)window.scrollBy(0,15);
  update(drag.x,drag.y);
 },35);
})();
</script>
