<script>
(function(){
 const url="{% url 'student_course_notebook_availability' notebook.id %}";
 let checking=false;
 async function checkNotebook(){
  if(checking||document.visibilityState==='hidden')return;
  checking=true;
  try{
   const response=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}});
   if(response.status===410){
    const result=await response.json();
    window.location.replace(result.redirect_url);
   }
  }catch(error){/* A temporary network error must not discard the student's work. */}
  finally{checking=false;}
 }
 window.setInterval(checkNotebook,15000);
 window.addEventListener('focus',checkNotebook);
 document.addEventListener('visibilitychange',checkNotebook);
})();
</script>
