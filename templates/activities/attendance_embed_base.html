<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>출결 신고서 수정</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
 <style>:root{--ingrid-gradient:linear-gradient(135deg,#ff80b5 0%,#8e44ad 100%)}body{background:#f8f9fb;color:#27232c}</style>
</head>
<body>
 {% if messages %}<div class="container-fluid px-3 px-md-4 pt-3">{% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}" role="alert">{{ message }}</div>{% endfor %}</div>{% endif %}
 {% block content %}{% endblock %}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
