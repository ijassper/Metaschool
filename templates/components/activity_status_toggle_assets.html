<style>
    .activity-status-control { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .activity-status-label { font-size: 0.75rem; font-weight: 800; white-space: nowrap; }
    .activity-paused-note { color: #9a3412; font-size: 0.66rem; font-weight: 700; }
    .activity-pause-button {
        border: 1px solid #d97706; border-radius: 999px; padding: 3px 10px;
        background: #fffbeb; color: #92400e; font-size: 0.7rem; font-weight: 700;
        cursor: pointer;
    }
    .activity-pause-button.is-paused { border-color: #087f5b; background: #ecfdf5; color: #065f46; }
    .activity-pause-button:hover { filter: brightness(0.95); }

    .activity-status-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1080;
        max-width: min(360px, calc(100vw - 48px));
        padding: 14px 18px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        color: #343a40;
        border: 1px solid rgba(142, 68, 173, 0.16);
        box-shadow: 0 18px 42px rgba(38, 29, 54, 0.14);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .activity-status-toast.show {
        opacity: 1;
        transform: translateY(0);
    }
</style>

<div id="activityStatusToast" class="activity-status-toast fw-bold"></div>

<script>
    if (!window.ingridActivityStatusToggleReady) {
        window.ingridActivityStatusToggleReady = true;
        window.ingridActivityStatusCsrfToken = '{{ csrf_token }}';

        window.getIngridCookie = function(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        };

        window.showActivityStatusToast = function(message) {
            const toast = document.getElementById('activityStatusToast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.ingridActivityStatusToastTimer);
            window.ingridActivityStatusToastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2800);
        };

        window.applyActivityStatus = function(button, data) {
            button.classList.toggle('is-paused', data.is_paused);
            button.textContent = data.is_paused ? '재개' : '일시중지';
            button.setAttribute('aria-label', data.is_paused ? '교사 일시중지 해제' : '학생 응시 일시중지');
            const control = button.closest('.activity-status-control');
            const label = control && control.querySelector('[data-activity-status-label]');
            if (label) label.textContent = data.status_text;
            let note = control && control.querySelector('[data-activity-paused-note]');
            if (data.is_paused && data.status_code !== 'PAUSED' && !note && control) {
                note = document.createElement('span');
                note.className = 'activity-paused-note';
                note.dataset.activityPausedNote = '';
                control.insertBefore(note, button);
            }
            if (note) {
                note.textContent = '교사 일시중지';
                note.hidden = !data.is_paused || data.status_code === 'PAUSED';
            }
        };

        document.addEventListener('click', function(event) {
            const button = event.target.closest('[data-activity-status-toggle]');
            if (!button || button.dataset.loading === 'true') return;

            event.preventDefault();
            button.dataset.loading = 'true';
            button.style.opacity = '0.68';

            fetch(button.dataset.url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': window.getIngridCookie('csrftoken') || window.ingridActivityStatusCsrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(function(response) {
                    if (!response.ok) throw new Error('상태 변경에 실패했습니다.');
                    return response.json();
                })
                .then(function(data) {
                    window.applyActivityStatus(button, data);
                    window.showActivityStatusToast(data.message);
                })
                .catch(function(error) {
                    window.showActivityStatusToast(error.message || '상태 변경 중 오류가 발생했습니다.');
                })
                .finally(function() {
                    button.dataset.loading = 'false';
                    button.style.opacity = '';
                });
        });
    }
</script>
