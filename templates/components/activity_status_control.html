<div class="activity-status-control">
    <span class="activity-status-label" data-activity-status-label>{{ activity.status_text }}</span>
    <button type="button"
            class="activity-status-toggle {% if activity.is_attainable %}is-on{% else %}is-off{% endif %}"
            role="switch"
            aria-checked="{% if activity.is_attainable %}true{% else %}false{% endif %}"
            aria-label="{% if activity.is_attainable %}응시 수동 마감{% else %}응시 수동 개방{% endif %}"
            title="{% if activity.is_attainable %}응시 마감{% else %}응시 개방{% endif %}"
            data-activity-status-toggle
            data-url="{% url 'toggle_activity_status' activity.id %}">
        <span class="activity-status-knob"></span>
    </button>
</div>
